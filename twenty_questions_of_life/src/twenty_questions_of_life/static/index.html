<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="20 Questions">
<title>Twenty Questions of Life</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #16181d; --soft: #5f6672;
    --line: #e2e0da; --accent: #7a5cff; --warn: #b04a2f;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --panel: #191b1f; --ink: #ecedef; --soft: #9aa1ad;
      --line: #2a2d33; --accent: #a08cff; --warn: #e08163;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.35rem; letter-spacing: -0.01em; margin: 0 0 4px; }
  p.lede { color: var(--soft); margin: 0 0 22px; font-size: 0.95rem; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }
  label { display: block; font-size: 0.8rem; text-transform: uppercase;
          letter-spacing: 0.06em; color: var(--soft); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px;
  }
  textarea { min-height: 8.5rem; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .field { margin-bottom: 14px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 11px;
    padding: 14px 18px; background: var(--accent); color: #fff; width: 100%;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  button.quiet { background: transparent; color: var(--soft); border: 1px solid var(--line); }
  .buttons { display: flex; gap: 10px; margin-top: 12px; }
  .buttons button { width: auto; flex: 1; }
  .buttons button.quiet { flex: 0 0 34%; }
  #done .buttons button.quiet { flex: 1 1 auto; }

  .progress { display: flex; gap: 3px; margin-bottom: 14px; }
  .progress span { height: 3px; flex: 1; background: var(--line); border-radius: 2px; }
  .progress span.done { background: var(--accent); }
  .meta { display: flex; justify-content: space-between; gap: 14px; font-size: 0.72rem;
          text-transform: uppercase; letter-spacing: 0.06em; color: var(--soft); margin-bottom: 12px; }
  .meta span:first-child { flex: 0 0 auto; }
  .meta span:last-child { flex: 1 1 auto; min-width: 0; text-align: right;
                          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .question { font-size: 1.3rem; line-height: 1.4; letter-spacing: -0.01em; margin: 0 0 12px; }
  .why { color: var(--soft); font-size: 0.9rem; margin: 0 0 4px; }
  .note { border-left: 2px solid var(--accent); padding-left: 12px; color: var(--soft);
          font-size: 0.92rem; margin-bottom: 14px; }
  .error { color: var(--warn); font-size: 0.88rem; margin-top: 10px; }

  .waiting { display: flex; align-items: center; gap: 10px; color: var(--soft); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
         animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 0.7; } }

  .score { font-size: 3rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .score small { font-size: 1rem; font-weight: 400; color: var(--soft); }
  .band { font-size: 1.1rem; margin: 8px 0 4px; }
  h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--soft); margin: 18px 0 6px; }
  ul { margin: 0; padding-left: 1.1rem; }
  li { margin-bottom: 5px; }
  a { color: var(--accent); }
  .resume { font-size: 0.9rem; }
  .resume button { background: none; color: var(--accent); padding: 6px 0; text-align: left;
                   width: auto; font-weight: 500; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Twenty Questions of Life</h1>
  <p class="lede">A panel of four decides each question after your last answer. Say what is
    true rather than what sounds wise — that is the whole thing being measured.</p>

  <!-- start -->
  <section id="setup" class="card">
    <div class="field">
      <label for="name">What should the panel call you</label>
      <input id="name" autocomplete="given-name" placeholder="Sam">
    </div>
    <div class="row field">
      <div>
        <label for="questions">Questions</label>
        <input id="questions" type="number" min="1" max="40" value="20" inputmode="numeric">
      </div>
      <div>
        <label for="panel">Panel</label>
        <select id="panel">
          <option value="full">Full — four voices</option>
          <option value="lean">Lean — chair only</option>
        </select>
      </div>
    </div>
    <button id="begin">Begin</button>
    <div id="resume" class="resume hidden"></div>
    <div id="setup-error" class="error hidden"></div>
  </section>

  <!-- interview -->
  <section id="interview" class="hidden">
    <div class="progress" id="progress"></div>
    <div class="card">
      <div class="meta"><span id="counter"></span><span id="area"></span></div>
      <div id="note" class="note hidden"></div>

      <div id="waiting" class="waiting hidden"><span class="dot"></span><span id="waiting-text"></span></div>

      <div id="asking" class="hidden">
        <p class="question" id="question"></p>
        <p class="why" id="why"></p>
        <div class="field" style="margin-top:14px">
          <label for="answer">Your answer</label>
          <textarea id="answer" placeholder="Whatever is actually true."></textarea>
        </div>
        <div class="buttons">
          <button class="quiet" id="pass">Pass</button>
          <button id="send">Send</button>
        </div>
      </div>
      <div id="live-error" class="error hidden"></div>
    </div>
  </section>

  <!-- verdict -->
  <section id="done" class="hidden">
    <div class="card">
      <div class="score" id="final-score"></div>
      <div class="band" id="final-band"></div>
      <p class="why" id="final-blurb"></p>
      <p id="headline" style="margin-top:16px"></p>
      <div id="verdict-body"></div>
      <h3>Full write-up</h3>
      <p><a id="download" href="#">Download the report and transcript</a></p>
      <div class="buttons"><button class="quiet" id="again">Start another</button></div>
    </div>
  </section>
</main>

<script>
const params = new URLSearchParams(location.search);
const token = params.get("t") || localStorage.getItem("tql-token") || "";
if (token) localStorage.setItem("tql-token", token);

const el = (id) => document.getElementById(id);
const show = (node, on) => node.classList.toggle("hidden", !on);
let sid = null, polling = null, currentNumber = null;

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Interview-Token": token, ...(options.headers || {}) },
  });
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    throw new Error(detail.detail || `Request failed (${response.status})`);
  }
  return response.json();
}

function fail(node, message) {
  node.textContent = message;
  show(node, Boolean(message));
}

async function begin() {
  el("begin").disabled = true;
  fail(el("setup-error"), "");
  try {
    const body = JSON.stringify({
      name: el("name").value || "Friend",
      questions: Number(el("questions").value) || 20,
      panel: el("panel").value,
    });
    const started = await api("/api/start", { method: "POST", body });
    enter(started.sid);
  } catch (error) {
    fail(el("setup-error"), error.message);
  } finally {
    el("begin").disabled = false;
  }
}

function enter(id) {
  sid = id;
  document.querySelector("p.lede").classList.add("hidden");
  localStorage.setItem("tql-sid", id);
  show(el("setup"), false);
  show(el("interview"), true);
  poll();
  polling = setInterval(poll, 2500);
}

function drawProgress(answered, total) {
  const bar = el("progress");
  if (bar.children.length !== total) {
    bar.innerHTML = "";
    for (let i = 0; i < total; i++) bar.appendChild(document.createElement("span"));
  }
  [...bar.children].forEach((mark, i) => mark.classList.toggle("done", i < answered));
}

const WAITING_TEXT = {
  thinking: "The panel is writing the next question…",
  marking: "The panel is marking that answer…",
  writing: "The panel is writing up the verdict…",
};

async function poll() {
  if (!sid) return;
  let state;
  try {
    state = await api(`/api/state/${sid}`);
  } catch (error) {
    fail(el("live-error"), error.message);
    return;
  }
  fail(el("live-error"), state.error ? `Panel trouble: ${state.error}` : "");
  drawProgress(state.answered, state.total);
  el("counter").textContent = `Question ${Math.min(state.answered + 1, state.total)} of ${state.total}`;

  if (state.note) {
    el("note").textContent = `Panel note: ${state.note}`;
    show(el("note"), true);
  }

  if (state.status === "question" && state.question) {
    show(el("waiting"), false);
    show(el("asking"), true);
    el("area").textContent = state.question.area;
    el("question").textContent = state.question.text;
    currentNumber = state.question.number;
    el("why").textContent = `Why this one: ${state.question.why}`;
    el("send").disabled = false;
    el("pass").disabled = false;
  } else if (state.status === "done") {
    clearInterval(polling);
    finish(state);
  } else {
    show(el("asking"), false);
    show(el("waiting"), true);
    el("waiting-text").textContent = WAITING_TEXT[state.status] || "Working…";
  }
}

async function send(text) {
  el("send").disabled = true;
  el("pass").disabled = true;
  show(el("asking"), false);
  show(el("waiting"), true);
  el("waiting-text").textContent = WAITING_TEXT.marking;
  try {
    await api(`/api/answer/${sid}`, {
      method: "POST",
      body: JSON.stringify({ text, number: currentNumber }),
    });
    el("answer").value = "";
  } catch (error) {
    fail(el("live-error"), error.message);
  }
  poll();
}

function list(title, items) {
  if (!items || !items.length) return "";
  return `<h3>${title}</h3><ul>${items.map((i) => `<li>${escapeHtml(i)}</li>`).join("")}</ul>`;
}

function escapeHtml(text) {
  const node = document.createElement("div");
  node.textContent = text;
  return node.innerHTML;
}

function finish(state) {
  show(el("interview"), false);
  show(el("done"), true);
  const result = state.result || {};
  el("final-score").innerHTML = `${result.score} <small>/ 5</small>`;
  el("final-band").textContent = result.band || "";
  el("final-blurb").textContent = result.band_blurb || "";
  const verdict = result.verdict;
  if (verdict) {
    el("headline").textContent = verdict.headline;
    el("verdict-body").innerHTML =
      list("What you have got hold of", verdict.what_you_understand) +
      list("Where you were repeating things", verdict.where_you_are_bluffing) +
      list("Answers that do not agree", verdict.contradictions) +
      `<h3>The question you dodged</h3><p>${escapeHtml(verdict.the_question_you_dodged || "")}</p>` +
      `<h3>What would change this</h3><p>${escapeHtml(verdict.what_would_change_this || "")}</p>`;
  }
  el("download").href = `/api/report/${sid}?t=${encodeURIComponent(token)}`;
  localStorage.removeItem("tql-sid");
}

async function offerResume() {
  const saved = localStorage.getItem("tql-sid");
  let sessions = [];
  try {
    sessions = await api("/api/sessions");
  } catch (error) {
    return; // a bad token shows up when you press Begin
  }
  const open = sessions.filter((s) => s.status !== "done");
  if (!open.length) return;
  const box = el("resume");
  box.innerHTML = "<h3>Pick up where you left off</h3>";
  open.slice(0, 5).forEach((s) => {
    const button = document.createElement("button");
    button.textContent = `${s.name} — ${s.answered} of ${s.total} answered${s.sid === saved ? " (this device)" : ""}`;
    button.onclick = () => enter(s.sid);
    box.appendChild(button);
    box.appendChild(document.createElement("br"));
  });
  show(box, true);
}

el("begin").onclick = begin;
el("send").onclick = () => send(el("answer").value.trim());
el("pass").onclick = () => send("pass");
el("again").onclick = () => location.href = location.pathname + (token ? `?t=${encodeURIComponent(token)}` : "");
// Ctrl/Cmd+Enter sends, for anyone doing this at a desk.
el("answer").addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === "Enter") el("send").click();
});
offerResume();
</script>
</body>
</html>
