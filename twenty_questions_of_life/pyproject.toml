[project]
name = "twenty_questions_of_life"
version = "0.1.0"
description = "An adaptive 20-question interview, run by an expert panel of agents, that tests whether you actually understand life or are repeating things you have heard"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]==0.85.0",
]

[project.optional-dependencies]
# Only needed for the web front end (python -m twenty_questions_of_life.web)
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "qrcode>=7.4",
]

[project.scripts]
kickoff = "twenty_questions_of_life.main:kickoff"
plot = "twenty_questions_of_life.main:plot"
interview = "twenty_questions_of_life.main:kickoff"
interview-web = "twenty_questions_of_life.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twenty_questions_of_life"]
